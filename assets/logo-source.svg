<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F5D50"/>
      <stop offset="1" stop-color="#1D3A32"/>
    </linearGradient>
    <linearGradient id="paw" x1="256" y1="150" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F5EF"/>
      <stop offset="1" stop-color="#EFEDE1"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#12261F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#F6F5EF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- heart embrace: the human side of the bond, holding the paw -->
  <path d="M256,158
           C256,104 186,68 122,102
           C 56,137 56,232 116,296
           L 256,446
           L 396,296
           C 456,232 456,137 390,102
           C 326,68 256,104 256,158 Z"
        fill="none" stroke="#D98A3D" stroke-width="15" stroke-linejoin="round"/>

  <!-- the dog's paw, resting inside that embrace -->
  <g filter="url(#soft)">
    <path d="M256 262
             C 300 262 336 297 336 341
             C 336 382 300 407 256 407
             C 212 407 176 382 176 341
             C 176 297 212 262 256 262 Z"
          fill="url(#paw)"/>
    <ellipse cx="156" cy="238" rx="34" ry="45" fill="url(#paw)" transform="rotate(-16 156 238)"/>
    <ellipse cx="220" cy="188" rx="35" ry="48" fill="url(#paw)" transform="rotate(-6 220 188)"/>
    <ellipse cx="292" cy="188" rx="35" ry="48" fill="url(#paw)" transform="rotate(6 292 188)"/>
    <ellipse cx="356" cy="238" rx="34" ry="45" fill="url(#paw)" transform="rotate(16 356 238)"/>
  </g>
</svg>
